# Déploiement AWS Amplify, comme la boîte à outils (boite-outils-astro).
version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.22
            - nvm use 22.22
            # Cache npm dans le projet (.npm), gardé par Amplify : installation plus rapide
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # La branche « main » du dépôt bibudem/studio est le site public (seule indexée :
            # robots.txt, balise robots). Decap CMS y enregistre directement. Toute autre
            # branche connectée serait une préproduction (noindex).
            - if [ "$AWS_BRANCH" = main ]; then export SITE_ENV=production; else export SITE_ENV=preprod; fi
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      # Gardés d'un build à l'autre : le cache npm (installation) et le cache d'Astro
      # (images converties : seules les nouvelles images sont converties au build suivant)
      cache:
        paths:
          - .npm/**/*
          - .cache/**/*
    environment:
      variables:
        NODE_OPTIONS: '--max-old-space-size=4096'
