# Déploiement AWS Amplify, comme la boîte à outils (boite-outils-astro).
version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.22
            - nvm use 22.22
            - npm ci
        build:
          commands:
            # La branche « main » du dépôt bibudem/studio est le site public (seule indexée :
            # robots.txt, balise robots). Decap CMS y enregistre directement. Toute autre
            # branche connectée serait une préproduction (noindex).
            - if [ "$AWS_BRANCH" = main ]; then export SITE_ENV=production; else export SITE_ENV=preprod; fi
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    environment:
      variables:
        NODE_OPTIONS: '--max-old-space-size=4096'
