# Sigles et abréviations développés dans les pages (WCAG 3.1.4, exigé par le SGQRI 008 3.0).
# Au build, src/plugins/rehype-abreviations.mjs entoure la première occurrence de chacun, dans
# chaque page, d’un <abbr title="forme développée">. Lu et vérifié par src/data/abreviations.mjs ;
# modifiable dans l’interface de rédaction (/admin/, « Abréviations »), qui réécrit ce fichier.
#
# sigle : tel qu’il s’écrit dans le texte (la casse compte) ; forme : forme développée ;
# theme : classement dans l’interface.
