# Menu de studio·bib : une section par entrée du menu principal, avec son menu de section.
# Lu par src/data/navigation.ts (qui le vérifie au build) et modifié par l'interface de rédaction
# (/admin/, « Pages » : ordre par glisser-déposer).
#
# Un élément de menu est l'identifiant d'une page (son chemin sans barre initiale) : son libellé
# est le titre de la page. Un objet sert pour :
# - une catégorie (enfants), avec ou sans page à elle (page) et un libellé propre (titre) ;
# - une page cachée (cache: true) : absente du menu, mais rattachée à sa catégorie pour le fil
#   d'Ariane et la mise en évidence ;
# - une page recommandée (recommande: true) : étoile à côté du libellé ;
# - un lien vers une autre section ou un autre site (lien).
# Une page absente de ces menus garde son fil d'Ariane d'après son chemin.
- cle: espaces
  titre: Espaces
  menu:
    - titre: Amphithéâtre
      page: espaces/amphitheatre
      enfants:
        - page: espaces/guide/amphitheatre
          cache: true
    - espaces/ateliers
    - espaces/zines
    - titre: Laboratoire de visualisation
      page: espaces/visualisation
      enfants:
        - page: espaces/guide/visualisation
          cache: true
    - titre: Salles de visionnement
      page: espaces/visionnement
      enfants:
        - espaces/salledevisio
        - espaces/placesdevisio
    - titre: Studios balado
      page: espaces/studiosbalado
      enfants:
        - espaces/studiosbaladoaudio
        - espaces/studiobaladovideo
    - titre: Studios vidéo
      page: espaces/studiosvideo
      enfants:
        - espaces/studiovideolsh
        - espaces/studiovideotgd
